name: CI

on:
  push:
  pull_request:

jobs:
  compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверить docker-compose.yml
        run: cp .env.example .env && docker compose config --quiet

  python:
    name: Python (ingest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: maqala_test
          POSTGRES_USER: maqala
          POSTGRES_PASSWORD: maqala
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maqala -d maqala_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://maqala:maqala@localhost:5432/maqala_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Установить зависимости
        run: pip install -e ".[dev]"
      - name: Линтер
        run: ruff check . && ruff format --check .
      - name: Тесты
        run: pytest

  # Линтер и тесты сайта (ESLint, проверка типов) добавятся на этапе 2 вместе с web/.
