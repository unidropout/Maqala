[project]
name = "maqala-ingest"
version = "0.1.0"
description = "Коннекторы Maqala: загрузка метаданных открытых научных статей"
requires-python = ">=3.12"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["ingest"]
